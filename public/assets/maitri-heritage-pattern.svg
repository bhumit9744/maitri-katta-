<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <!-- 4-petal lotus blossom -->
    <g id="blossom">
      <circle cx="0" cy="0" r="1.8" fill="#FFC900" fill-opacity="0.5" />
      <circle cx="0" cy="0" r="1.0" fill="#9C171C" fill-opacity="0.6" />
      <!-- Petals -->
      <path d="M0 -6 C-2 -3 -1.5 -1 0 0 C1.5 -1 2 -3 0 -6 Z" fill="#9C171C" fill-opacity="0.22" />
      <path d="M0 6 C-2 3 -1.5 1 0 0 C1.5 1 2 3 0 6 Z" fill="#9C171C" fill-opacity="0.22" />
      <path d="M-6 0 C-3 -2 -1 -1.5 0 0 C-1 1.5 -3 2 -6 0 Z" fill="#9C171C" fill-opacity="0.22" />
      <path d="M6 0 C3 -2 1 -1.5 0 0 C1 1.5 3 2 6 0 Z" fill="#9C171C" fill-opacity="0.22" />
    </g>
  </defs>

  <!-- Geometric Jaali Lattice Grid -->
  <g fill="none" stroke="#321C14" stroke-width="0.85" opacity="0.14">
    <!-- Diamond Grid -->
    <path d="M30 0 L60 30 L30 60 L0 30 Z" />
    
    <!-- Moorish / Indian Pointed & Curved Arches -->
    <path d="M0 0 C15 15 15 15 30 0 C45 15 45 15 60 0" />
    <path d="M0 60 C15 45 15 45 30 60 C45 45 45 45 60 60" />
    <path d="M0 0 C15 15 15 15 0 30 C15 45 15 45 0 60" />
    <path d="M60 0 C45 15 45 15 60 30 C45 45 45 45 60 60" />

    <!-- Delicate inner star diamond -->
    <path d="M30 12 L48 30 L30 48 L12 30 Z" stroke-dasharray="1.5 2.5" stroke-width="0.6" opacity="0.75" />
  </g>

  <!-- Secondary subtle connecting diagonal lines -->
  <g fill="none" stroke="#9C171C" stroke-width="0.5" opacity="0.10">
    <line x1="0" y1="0" x2="60" y2="60" stroke-dasharray="1 3" />
    <line x1="60" y1="0" x2="0" y2="60" stroke-dasharray="1 3" />
  </g>

  <!-- Interlocking node accent dots -->
  <g fill="#9C171C" opacity="0.20">
    <circle cx="30" cy="0" r="1.5" />
    <circle cx="60" cy="30" r="1.5" />
    <circle cx="30" cy="60" r="1.5" />
    <circle cx="0" cy="30" r="1.5" />
  </g>

  <!-- Central Lotus Blossom -->
  <use href="#blossom" x="30" y="30" />

  <!-- Corner Lotus Blossoms for seamless edge tiling -->
  <use href="#blossom" x="0" y="0" />
  <use href="#blossom" x="60" y="0" />
  <use href="#blossom" x="0" y="60" />
  <use href="#blossom" x="60" y="60" />
</svg>