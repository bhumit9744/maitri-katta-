<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <g fill="none" stroke="#241915" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.055">
    
    <!-- 1. Clay Handi Pot with Steam (Center: 32, 32) -->
    <g transform="translate(32, 28)">
      <!-- Pot body -->
      <path d="M-10 6 C-12 12 -8 18 0 18 C8 18 12 12 10 6 Z" />
      <!-- Rim -->
      <ellipse cx="0" cy="5" rx="10" ry="2.2" />
      <!-- Steam swirls -->
      <path d="M-3 0 C-4 -3 -2 -5 -3 -8" stroke-width="0.9" />
      <path d="M2 1 C3 -2 1 -4 2 -7" stroke-width="0.9" />
    </g>

    <!-- 2. Star Anise (Chakraphool) Spice (118, 30) -->
    <g transform="translate(118, 30)">
      <circle cx="0" cy="0" r="2.2" fill="#241915" fill-opacity="0.05" />
      <!-- 8 radiating pods -->
      <path d="M0 -3 L0 -9" stroke-width="1.3" />
      <path d="M0 3 L0 9" stroke-width="1.3" />
      <path d="-3 0 L-9 0" stroke-width="1.3" />
      <path d="3 0 L9 0" stroke-width="1.3" />
      <path d="-2.2 -2.2 L-6.5 -6.5" stroke-width="1.3" />
      <path d="2.2 2.2 L6.5 6.5" stroke-width="1.3" />
      <path d="-2.2 2.2 L-6.5 6.5" stroke-width="1.3" />
      <path d="2.2 -2.2 L6.5 -6.5" stroke-width="1.3" />
      <!-- Tiny pod seed dots -->
      <circle cx="0" cy="-6" r="0.7" fill="#241915" stroke="none" />
      <circle cx="0" cy="6" r="0.7" fill="#241915" stroke="none" />
      <circle cx="-6" cy="0" r="0.7" fill="#241915" stroke="none" />
      <circle cx="6" cy="0" r="0.7" fill="#241915" stroke="none" />
    </g>

    <!-- 3. Tandoori Skewer (Seekh Kebab) diagonally (78, 80) -->
    <g transform="translate(78, 80) rotate(-35)">
      <!-- Long metal rod -->
      <line x1="-18" y1="0" x2="18" y2="0" stroke-width="1" />
      <!-- Pointed tip -->
      <path d="M18 0 L22 0" stroke-width="0.8" />
      <!-- Skewered cubes -->
      <rect x="-12" y="-3.5" width="6" height="7" rx="1.5" />
      <rect x="-4" y="-4" width="6.5" height="8" rx="1.5" />
      <rect x="4.5" y="-3.5" width="6" height="7" rx="1.5" />
      <rect x="12.5" y="-3" width="4.5" height="6" rx="1" />
      <!-- Ring handle on left -->
      <circle cx="-20" cy="0" r="2.2" stroke-width="0.9" />
    </g>

    <!-- 4. Indian Chili (Mirchi) (35, 125) -->
    <g transform="translate(35, 125) rotate(20)">
      <!-- Chili body -->
      <path d="M-10 -4 C-5 -3 4 0 10 7 C8 8 2 6 -6 1 C-10 -1 -11 -3 -10 -4 Z" />
      <!-- Stem -->
      <path d="M-10 -4 C-12 -6 -14 -5 -15 -7" stroke-width="0.9" />
      <!-- Cap -->
      <path d="M-8 -5 C-9 -3 -9 -2 -11 -3" stroke-width="0.9" />
    </g>

    <!-- 5. Rolling Pin (Latna / Belan) (122, 128) -->
    <g transform="translate(122, 128) rotate(-25)">
      <!-- Main cylinder -->
      <rect x="-12" y="-3.5" width="24" height="7" rx="1" />
      <!-- Left handle -->
      <path d="M-12 -1.5 L-18 -1.5 C-19 -2.5 -20 -1 -21 -1 L-21 1 C-20 1 -19 2.5 -18 1.5 L-12 1.5" stroke-width="0.9" />
      <!-- Right handle -->
      <path d="M12 -1.5 L18 -1.5 C19 -2.5 20 -1 21 -1 L21 1 C20 1 19 2.5 18 1.5 L12 1.5" stroke-width="0.9" />
    </g>

    <!-- 6. Mortar and Pestle (Khalbatta) (80, 24) -->
    <g transform="translate(80, 24)">
      <!-- Mortar bowl -->
      <path d="M-8 2 C-10 8 -6 12 0 12 C6 12 10 8 8 2 Z" />
      <ellipse cx="0" cy="2" rx="8" ry="2" />
      <path d="M-5 12 L-6 14 L6 14 L5 12" stroke-width="0.9" />
      <!-- Pestle stick -->
      <path d="M-3 -4 L3 6" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- 7. Crossed Spoon and Fork (142, 78) -->
    <g transform="translate(142, 78)">
      <!-- Spoon diagonal -->
      <path d="M-8 -8 L8 8" stroke-width="0.9" />
      <ellipse cx="-9" cy="-9" rx="2.5" ry="3.5" transform="rotate(-45 -9 -9)" stroke-width="0.9" />
      <!-- Fork diagonal -->
      <path d="M-8 8 L8 -8" stroke-width="0.9" />
      <path d="M7 -7 L10 -10 M9 -9 L11 -7 M7 -9 L9 -11" stroke-width="0.9" />
    </g>

    <!-- 8. Cutting Chai Glass / Earthenware Kulhad (18, 78) -->
    <g transform="translate(18, 78)">
      <!-- Tapered tumbler glass -->
      <path d="M-5 -6 L5 -6 L3.5 8 L-3.5 8 Z" />
      <ellipse cx="0" cy="-6" rx="5" ry="1.5" stroke-width="0.8" />
      <!-- Vertical glass facets -->
      <line x1="-2" y1="-4" x2="-1.5" y2="7" stroke-width="0.6" opacity="0.6" />
      <line x1="2" y1="-4" x2="1.5" y2="7" stroke-width="0.6" opacity="0.6" />
      <!-- Steam -->
      <path d="M0 -9 C-1 -11 1 -13 0 -15" stroke-width="0.8" />
    </g>

    <!-- 9. Cardamom (Elaichi) Pod & Cloves (Laung) (75, 138) -->
    <g transform="translate(75, 138)">
      <!-- Cardamom pod -->
      <path d="M-5 -2 C-3 -6 3 -6 5 -2 C6 2 2 6 -2 5 C-5 4 -6 1 -5 -2 Z" stroke-width="1" />
      <path d="M0 -5 C1 -1 0 2 -1 5" stroke-width="0.7" opacity="0.6" />
      <!-- Clove nearby -->
      <circle cx="8" cy="-1" r="1.5" stroke-width="0.9" />
      <line x1="8" y1="0.5" x2="8" y2="6" stroke-width="1.1" />
    </g>

    <!-- 10. Kadai / Pan with Dual Ring Handles (Seamless Corner Tiles: 0, 0 / 160, 0 / 0, 160 / 160, 160) -->
    <g transform="translate(0, 0)">
      <path d="M-8 4 C-9 9 -5 13 0 13 C5 13 9 9 8 4 Z" />
      <ellipse cx="0" cy="4" rx="8" ry="2" />
      <!-- Ring handles -->
      <path d="M-8 3 C-10 1 -11 5 -8 5" stroke-width="0.8" />
      <path d="M8 3 C10 1 11 5 8 5" stroke-width="0.8" />
    </g>
    <g transform="translate(160, 0)">
      <path d="M-8 4 C-9 9 -5 13 0 13 C5 13 9 9 8 4 Z" />
      <ellipse cx="0" cy="4" rx="8" ry="2" />
      <path d="M-8 3 C-10 1 -11 5 -8 5" stroke-width="0.8" />
      <path d="M8 3 C10 1 11 5 8 5" stroke-width="0.8" />
    </g>
    <g transform="translate(0, 160)">
      <path d="M-8 4 C-9 9 -5 13 0 13 C5 13 9 9 8 4 Z" />
      <ellipse cx="0" cy="4" rx="8" ry="2" />
      <path d="M-8 3 C-10 1 -11 5 -8 5" stroke-width="0.8" />
      <path d="M8 3 C10 1 11 5 8 5" stroke-width="0.8" />
    </g>
    <g transform="translate(160, 160)">
      <path d="M-8 4 C-9 9 -5 13 0 13 C5 13 9 9 8 4 Z" />
      <ellipse cx="0" cy="4" rx="8" ry="2" />
      <path d="M-8 3 C-10 1 -11 5 -8 5" stroke-width="0.8" />
      <path d="M8 3 C10 1 11 5 8 5" stroke-width="0.8" />
    </g>

    <!-- 11. Fresh Coriander / Mint Leaf Sprig (Seamless Edge: 0, 80 / 160, 80) -->
    <g transform="translate(0, 80)">
      <path d="M0 0 C4 -3 8 -1 10 -4" stroke-width="0.8" />
      <ellipse cx="6" cy="-4" rx="2.5" ry="1.5" transform="rotate(-25 6 -4)" />
      <ellipse cx="10" cy="-6" rx="2" ry="1.2" transform="rotate(20 10 -6)" />
    </g>
    <g transform="translate(160, 80)">
      <path d="M0 0 C-4 -3 -8 -1 -10 -4" stroke-width="0.8" />
      <ellipse cx="-6" cy="-4" rx="2.5" ry="1.5" transform="rotate(25 -6 -4)" />
      <ellipse cx="-10" cy="-6" rx="2" ry="1.2" transform="rotate(-20 -10 -6)" />
    </g>

    <!-- 12. Garlic Clove & Peppercorn Accents (Seamless Edge: 80, 0 / 80, 160) -->
    <g transform="translate(80, 0)">
      <path d="M-3 0 C-4 4 -2 7 0 9 C2 7 4 4 3 0 Z" stroke-width="0.9" />
      <circle cx="5" cy="4" r="1.1" fill="#241915" stroke="none" />
    </g>
    <g transform="translate(80, 160)">
      <path d="M-3 0 C-4 4 -2 7 0 9 C2 7 4 4 3 0 Z" stroke-width="0.9" />
      <circle cx="5" cy="4" r="1.1" fill="#241915" stroke="none" />
    </g>

    <!-- Tiny scattered spice grain dots (Mustard seeds / Kalonji / Peppercorns) -->
    <circle cx="55" cy="65" r="0.9" fill="#241915" stroke="none" opacity="0.6" />
    <circle cx="102" cy="55" r="0.8" fill="#241915" stroke="none" opacity="0.6" />
    <circle cx="135" cy="105" r="0.9" fill="#241915" stroke="none" opacity="0.6" />
    <circle cx="25" cy="105" r="0.8" fill="#241915" stroke="none" opacity="0.6" />
    <circle cx="95" cy="115" r="0.9" fill="#241915" stroke="none" opacity="0.6" />
    <circle cx="58" cy="145" r="0.7" fill="#241915" stroke="none" opacity="0.6" />
    <circle cx="148" cy="25" r="0.8" fill="#241915" stroke="none" opacity="0.6" />
  </g>
</svg>